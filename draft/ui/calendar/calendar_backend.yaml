# =====================================================================
#  ESPHome – Kalender-Backend (als Package einbinden)
#
#  packages:
#    calendar: !include
#      file: calendar_backend.yaml
#      vars:
#        cal_sensor: sensor.display_kalender
#
#  Sprache (Default: Englisch) – optionale vars, z.B. für Deutsch:
#
#        month_names: ["Januar", "Februar", "März", "April", "Mai", "Juni",
#                      "Juli", "August", "September", "Oktober", "November", "Dezember"]
#        title_format: "{month} {year}"         # Kopfzeile über dem Raster
#        day_format: "{day}. {month}"           # Kopf der Terminliste
#        today_format: "Heute, {day}. {month}"  # ... wenn der Tag heute ist
#        text_events: "Termine"                 # Kopf, solange kein Tag gewählt
#        text_all_day: "ganztags"
#        text_no_events: "Keine Termine"
#
#  Der Monatstitel wird hier aus dem yyyymm-Feld von "grid" gebaut;
#  das HA-Attribut "title" wird nicht (mehr) benötigt.
#
#  Erwartet im Widget: buttonmatrix id: cal_matrix,
#                      labels cal_title_label, cal_day_header, cal_event_list
# =====================================================================

defaults:
  month_names: ["January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"]
  title_format: "{month} {year}"
  day_format: "{month} {day}"
  today_format: "Today, {month} {day}"
  text_events: "Events"
  text_all_day: "all day"
  text_no_events: "No events"

globals:
  - id: cal_offset          # Spalte des 1. (0 = Montag)
    type: int
    initial_value: "0"
  - id: cal_dim             # Tage im Monat
    type: int
    initial_value: "0"
  - id: cal_today
    type: int
    initial_value: "0"
  - id: cal_sel_day         # aktuell gewählter Tag (Terminliste rechts)
    type: int
    initial_value: "0"
  - id: cal_month_key       # yyyymm des angezeigten Monats
    type: int
    initial_value: "0"
  - id: cal_month_name      # Name des angezeigten Monats (aus month_names)
    type: std::string
    initial_value: '""'

text_sensor:
  - platform: homeassistant
    id: cal_grid
    entity_id: ${cal_sensor}
    attribute: grid
    internal: true
    on_value:
      - script.execute: cal_render

  - platform: homeassistant
    id: cal_days
    entity_id: ${cal_sensor}
    attribute: days
    internal: true
    on_value:
      - script.execute: cal_render

  - platform: homeassistant
    id: cal_events
    entity_id: ${cal_sensor}
    attribute: events
    internal: true
    on_value:
      - script.execute: cal_show_day

script:
  # -------------------------------------------------------------------
  #  Baut die Button-Map der Matrix neu auf (4–6 Wochenzeilen)
  # -------------------------------------------------------------------
  - id: cal_render
    mode: queued
    then:
      - lambda: |-
          // Speicher muss statisch sein: LVGL kopiert die Map NICHT
          static char labels[42][24];   // groß genug für jeden int (sonst -Wformat-truncation)
          static const char *btn_map[42 + 5 + 1];

          int offset = -1, dim = 0, today = 0, key = 0;
          if (sscanf(id(cal_grid).state.c_str(), "%d;%d;%d;%d", &offset, &dim, &today, &key) != 4 ||
              offset < 0 || offset > 6 || dim < 28 || dim > 31) {
            return;  // noch keine gültigen Daten aus HA
          }

          // Termintage -> Bitmaske
          uint32_t mask = 0;
          int v = 0; bool in_num = false;
          for (char c : id(cal_days).state + ";") {
            if (c >= '0' && c <= '9') { v = v * 10 + (c - '0'); in_num = true; }
            else {
              if (in_num && v >= 1 && v <= 31) mask |= (1UL << v);
              v = 0; in_num = false;
            }
          }

          const int rows = (offset + dim + 6) / 7;   // 4..6
          const int cells = rows * 7;

          int k = 0;
          for (int i = 0; i < cells; i++) {
            int day = i - offset + 1;
            if (day >= 1 && day <= dim) {
              if (day == today) snprintf(labels[i], sizeof(labels[i]), "#FFB300 %d#", day);
              else              snprintf(labels[i], sizeof(labels[i]), "%d", day);
            } else {
              strcpy(labels[i], " ");   // NICHT "" – das ist der Map-Terminator!
            }
            btn_map[k++] = labels[i];
            if (i % 7 == 6 && i != cells - 1) btn_map[k++] = "\n";
          }
          btn_map[k] = "";

          lv_obj_t *m = id(cal_matrix)->obj;
          lv_buttonmatrix_set_map(m, btn_map);
          // In C++ ergibt "Enum | Enum" ein int -> zurück auf den Enum-Typ casten
          lv_buttonmatrix_clear_button_ctrl_all(m, (lv_buttonmatrix_ctrl_t)(
              LV_BUTTONMATRIX_CTRL_HIDDEN | LV_BUTTONMATRIX_CTRL_CHECKED |
              LV_BUTTONMATRIX_CTRL_RECOLOR | LV_BUTTONMATRIX_CTRL_DISABLED));
          for (int i = 0; i < cells; i++) {
            int day = i - offset + 1;
            if (day < 1 || day > dim) {           // Leerzellen: Platz bleibt, nicht sichtbar
              lv_buttonmatrix_set_button_ctrl(m, i, LV_BUTTONMATRIX_CTRL_HIDDEN);
              continue;
            }
            if (mask & (1UL << day)) lv_buttonmatrix_set_button_ctrl(m, i, LV_BUTTONMATRIX_CTRL_CHECKED);
            if (day == today)        lv_buttonmatrix_set_button_ctrl(m, i, LV_BUTTONMATRIX_CTRL_RECOLOR);
          }

          // Monatstitel aus yyyymm in der eingestellten Sprache
          static const char *const MONTHS[12] = {"${ month_names | join('", "') }"};
          int mon = key % 100;
          if (mon >= 1 && mon <= 12) {
            id(cal_month_name) = MONTHS[mon - 1];
            std::string t = "${title_format}";
            size_t p;
            if ((p = t.find("{month}")) != std::string::npos) t.replace(p, 7, id(cal_month_name));
            if ((p = t.find("{year}")) != std::string::npos) t.replace(p, 6, std::to_string(key / 100));
            lv_label_set_text(id(cal_title_label), t.c_str());
          }

          id(cal_offset) = offset;
          id(cal_dim) = dim;
          // Monats- oder Tageswechsel: Auswahl auf "heute" bzw. den 1. setzen
          if (key != id(cal_month_key) || today != id(cal_today) ||
              id(cal_sel_day) < 1 || id(cal_sel_day) > dim) {
            id(cal_month_key) = key;
            id(cal_today) = today;
            id(cal_sel_day) = today > 0 ? today : 1;
          }
      - script.execute: cal_show_day

  # -------------------------------------------------------------------
  #  Terminliste für den gewählten Tag
  # -------------------------------------------------------------------
  - id: cal_show_day
    mode: queued
    then:
      - lvgl.label.update:
          id: cal_day_header
          text: !lambda |-
            int d = id(cal_sel_day);
            if (d < 1) return std::string("${text_events}");
            std::string t = (d == id(cal_today)) ? "${today_format}" : "${day_format}";
            size_t p;
            if ((p = t.find("{day}")) != std::string::npos) t.replace(p, 5, std::to_string(d));
            if ((p = t.find("{month}")) != std::string::npos) t.replace(p, 7, id(cal_month_name));
            return t;
      - lvgl.label.update:
          id: cal_event_list
          text: !lambda |-
            int d = id(cal_sel_day);
            if (d < 1) return std::string("");
            char prefix[16];              // groß genug für jeden int (sonst -Wformat-truncation)
            snprintf(prefix, sizeof(prefix), "%02d|", d);

            const std::string &ev = id(cal_events).state;
            std::string out;
            size_t pos = 0;
            while (pos < ev.size()) {
              size_t nl = ev.find('\n', pos);
              if (nl == std::string::npos) nl = ev.size();
              if (ev.compare(pos, 3, prefix) == 0) {
                size_t p2 = ev.find('|', pos + 3);
                if (p2 != std::string::npos && p2 < nl) {
                  std::string tm = ev.substr(pos + 3, p2 - pos - 3);
                  out += (tm == "-") ? "${text_all_day}" : tm;
                  out += "   ";
                  out += ev.substr(p2 + 1, nl - p2 - 1);
                  out += "\n";
                }
              }
              pos = nl + 1;
            }
            if (out.empty()) return std::string("${text_no_events}");
            out.pop_back();
            return out;
