# Remote image button tile — calls homeassistant.turn_on for an HA entity on tap.
# Stateless: no state feedback from HA, no detail page.
# Optional background image is downloaded from a URL (online_image) once the
# network is up; icon and label are drawn on top of it.
#
# vars:
#   uid:                    unique identifier
#   entity_id:              HA entity to turn on, e.g. "script.good_night",
#                           "scene.movie", "light.kitchen"
#   row:                    grid row
#   column:                 grid column
#   text:                   label shown bottom left (wraps, full tile width) (optional – hidden if omitted)
#   icon:                   icon glyph shown top left (optional – hidden if omitted)
#   row_span:               (default: 1)
#   column_span:            (default: 1)
#   page_id:                parent page                             (default: main_page)
#   image_url:              image URL (optional; if not set, no image is loaded)
#   image_format:           image format                            (default: AUTO)
#   image_width:            image width in px                       (default: 128)
#   image_height:           image height in px                      (default: 128)
#   image_update_interval:  re-download interval, e.g. "30min"      (default: never)
#   image_alignment:        image alignment inside the tile         (default: center)
#   image_x:                image x offset                          (default: 0)
#   image_y:                image y offset                          (default: 0)
#   image_opa:              image opacity. 0%-100% or TRANSP/COVER  (default: COVER)
#
#   -- background: plain colour or gradient; a background image, if any, is drawn on top --
#   bg_color:               main colour                             (default: $button_off_color)
#   bg_grad_dir:            NONE | VER | HOR                        (default: NONE = plain colour)
#   bg_grad_color:          second gradient colour                  (default: bg_color)
#   bg_main_stop:           0..255 where bg_color starts to fade    (default: 0)
#   bg_grad_stop:           0..255 where bg_grad_color is reached   (default: 255)
#
# requires:
#   $icon_font (theme), network connection, HA API connection
#   "Allow the device to perform Home Assistant actions" must be enabled
#   in the HA ESPHome integration options, otherwise the tap does nothing.
#
# notes:
#   - Download is attempted every 12 s until it succeeds; on error it retries.
#   - The image stays hidden until the first successful download.
#   - RAM: width x height x 3 bytes (RGB565 + alpha), 128x128 ≈ 48 kB.


globals:
- id: ${uid}_current_value
  type: float
  initial_value: '0.0'
- id: ${uid}_img_state          # 0 = pending, 1 = downloading, 2 = loaded
  type: uint8_t
  initial_value: '0'

http_request:

image:
- platform: online_image
  id: ${uid}_bg_image
  url: '${image_url | default("http://localhost/no_image.png")}'
  format: ${image_format | default("AUTO")}
  type: RGB565
  transparency: alpha_channel
  resize: ${image_width | default(128)}x${image_height | default(128)}
  update_interval: ${image_update_interval | default("never")}
  on_download_finished:
  - lambda: id(${uid}_img_state) = 2;
  - lvgl.image.update:
      id: img_${uid}
      src: ${uid}_bg_image
  - lvgl.widget.show: img_${uid}
  on_error:
  - lambda: id(${uid}_img_state) = 0;   # retry on next interval tick

# ── Initial download once the network is up (works with WiFi and Ethernet) ──
interval:
- interval: 12s
  then:
  - if:
      condition:
        lambda: |-
          return ${ 'true' if (image_url | default('')) != '' else 'false' } &&
                 id(${uid}_img_state) == 0 &&
                 network::is_connected();
      then:
      - lambda: id(${uid}_img_state) = 1;
      - component.update: ${uid}_bg_image



lvgl:
  pages:
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - container:
        id: ${uid}_tile
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_row_span: ${row_span | default(1)}
        grid_cell_column_span: ${column_span | default(1)}
        grid_cell_x_align: stretch
        grid_cell_y_align: stretch
        widgets:
        - button:
            id: button_${uid}
            bg_opa: ${bg_opa | default("COVER")}
            bg_color: ${bg_color | default(button_off_color)}
            bg_grad_color: ${bg_grad_color | default(bg_color | default(button_off_color))}
            bg_grad_dir: ${bg_grad_dir | default("NONE")}
            bg_main_stop: ${bg_main_stop | default(0)}
            bg_grad_stop: ${bg_grad_stop | default(255)}
            clip_corner: true  
            widgets:

            - image:
                id: img_${uid}
                src: ${uid}_bg_image
                align: ${image_alignment | default("center")}
                opa: ${image_opa | default("COVER")}
                hidden: true             # shown after successful download
                y: ${image_y | default(0)}
                x: ${image_x | default(0)}

            - label:
                id: icon_${uid}
                text_font: $icon_font
                align: top_left
                hidden: "${ 'false' if (icon | default('')) != '' else 'true' }"   # no icon → no label
                text: "${icon | default('')}"
            - label:
                id: label_${uid}
                align: bottom_left
                long_mode: wrap
                width: 100%
                hidden: "${ 'false' if (text | default('')) != '' else 'true' }"   # no text → no label
                text: "${text | default('')}"
            on_short_click:
              then:
              - homeassistant.action:
                  action: homeassistant.turn_on
                  data:
                    entity_id: ${entity_id}
