---
# Remote button tile — triggers a Home Assistant button (or script/scene/input_button) on press.
# Uses an remote image as backgroud (if url is supplied)
# Simple type: tile-only, no detail page, no state.
#
# vars:
#   uid:          unique identifier
#   entity_id:    HA entity, e.g. "button.restart", "script.good_night", "scene.movie_mode"
#   row:          grid row
#   column:       grid column
#   text:         tile label
#   icon:         icon glyph
#   row_span:     (default: 1)
#   column_span:  (default: 1)
#   image_url:             URL of a PNG/JPEG background image (optional – no image if omitted)
#   image_width:           image is scaled to fit inside this width  (default: 128)
#   image_height:          image is scaled to fit inside this height (default: 128)
#                          (aspect ratio is preserved)
#   image_format:          AUTO | PNG | JPEG | BMP | QOI   (default: AUTO, needs a correct
#                          Content-Type from the server – set explicitly if decoding fails)
#   image_alignment:       LVGL align of the image (default: center)
#   image_opa:             opacity of the image, e.g. 60% to keep text readable (default: COVER)
#   image_update_interval: re-download interval, e.g. 15min (default: never = load once)
#   page_id:      parent page (default: main_page)


globals:
- id: ${uid}_current_value
  type: float
  initial_value: '0.0'
- id: ${uid}_img_state          # 0 = pending, 1 = downloading, 2 = loaded
  type: uint8_t
  initial_value: '0'

http_request:

image:
- platform: online_image
  id: ${uid}_bg_image
  url: '${image_url | default("http://localhost/no_image.png")}'
  format: ${image_format | default("AUTO")}
  type: RGB565
  transparency: alpha_channel
  resize: ${image_width | default(128)}x${image_height | default(128)}
  update_interval: ${image_update_interval | default("never")}
  on_download_finished:
  - lambda: id(${uid}_img_state) = 2;
  - lvgl.image.update:
      id: img_${uid}
      src: ${uid}_bg_image
  - lvgl.widget.show: img_${uid}
  on_error:
  - lambda: id(${uid}_img_state) = 0;   # retry on next interval tick

# ── Initial download once the network is up (works with WiFi and Ethernet) ──
interval:
- interval: 12s
  then:
  - if:
      condition:
        lambda: |-
          return ${ 'true' if (image_url | default('')) != '' else 'false' } &&
                 id(${uid}_img_state) == 0 &&
                 network::is_connected();
      then:
      - lambda: id(${uid}_img_state) = 1;
      - component.update: ${uid}_bg_image



lvgl:
  pages:
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - container:
        id: ${uid}_tile
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_row_span: ${row_span | default(1)}
        grid_cell_column_span: ${column_span | default(1)}
        grid_cell_x_align: stretch
        grid_cell_y_align: stretch
        widgets:
        - button:
            id: button_${uid}
            clip_corner: true  
            widgets:

            - image:
                id: img_${uid}
                src: ${uid}_bg_image
                align: ${image_alignment | default("center")}
                opa: ${image_opa | default("COVER")}
                hidden: true             # shown after successful download
                y: ${image_y | default(0)}
                x: ${image_x | default(0)}

            - label:
                id: icon_${uid}
                text_font: $icon_font
                align: top_left
                text: ${icon}
            - label:
                id: label_${uid}
                align: bottom_left
                long_mode: wrap
                width: 100%
                text: ${text}
            on_short_click:
              then:
              - homeassistant.action:
                  action: homeassistant.turn_on
                  data:
                    entity_id: ${entity_id}
