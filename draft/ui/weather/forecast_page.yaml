# =====================================================================
#  Weather forecast – page content: hourly forecast per day
#  Header: ◀  "Tuesday 20"  ▶ with the day's icon, max / min and
#  precipitation; below one card per forecast hour (time, icon,
#  temperature, precipitation if any, wind). ◀ / ▶ switch through the days
#  of the forecast; a tap on a day in forecast_tile.yaml opens this page
#  on that day. The page itself (styles, background, swipe) is defined by
#  you; this package adds its content to it.
#  Needs forecast_backend.yaml with the same uid.
#
#  packages:
#    weather_page: !include
#      file: draft/ui/weather/forecast_page.yaml
#      vars:
#        uid: wx
#        page_id: weather_page
#        weekday_names: ["Montag", "Dienstag", "Mittwoch", "Donnerstag",
#                        "Freitag", "Samstag", "Sonntag"]
#        date_format: "{weekday}, {day}."
#        today_label: "Heute"
#        tomorrow_label: "Morgen"
#        no_hourly_text: "Für diesen Tag gibt es keine Stundenwerte"
#        home_label: "Start"
#
#  vars:
#    uid:               same as the backend                       (default: wx)
#    page_id:           the (existing) weather page               (default: weather_page)
#    home_page:         target of the home button                 (default: main_page)
#    home_label:        text next to the house symbol             (default: "Home")
#
#    -- text (default: English) --
#    weekday_names:     7 names, starting with Monday
#    date_format:       header; {weekday} and {day} are replaced  (default: "{weekday} {day}")
#    today_label:       replaces {weekday} for today ("" = off)   (default: "Today")
#    tomorrow_label:    replaces {weekday} for tomorrow ("" = off) (default: "Tomorrow")
#    no_hourly_text:    shown when a day has no hourly values
#                       (met.no gives hourly values for ~2–3 days only)
#
#    -- look --
#    title_font:        (default: nunito_36)    summary_font: (default: nunito_24)
#    hour_font:         (default: nunito_20)    temp_font:    (default: nunito_24)
#    small_font:        precipitation / wind on the cards         (default: nunito_14)
#    text_color:        (default: 0xFFFFFF)     dim_color:    (default: 0xB0B0B8)
#    precip_color:      (default: 0x64B5F6)
#    card_width:        (default: 112)          card_height:  (default: 136)
#    card_color:        (default: 0x000000)     card_opa:     card background opacity, 0..255 (default: 80)
#    pad_all:           padding of the page content               (default: 12)
#
#  notes:
#    - The cards are created at runtime, as many as the day has hours.
#    - "Allow the device to perform Home Assistant actions" must be enabled
#      (the backend calls weather.get_forecasts).
# =====================================================================

defaults:
  uid: wx
  page_id: weather_page
  home_page: main_page
  home_label: "Home"
  weekday_names: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"]
  date_format: "{weekday} {day}"
  today_label: "Today"
  tomorrow_label: "Tomorrow"
  no_hourly_text: "No hourly forecast for this day"
  title_font: nunito_36
  summary_font: nunito_24
  hour_font: nunito_20
  temp_font: nunito_24
  small_font: nunito_14
  text_color: "0xFFFFFF"
  dim_color: "0xB0B0B8"
  precip_color: "0x64B5F6"
  card_width: 112
  card_height: 136
  card_color: "0x000000"
  card_opa: 80


script:
  - id: !extend ${uid}_updated
    then:
      - script.execute: ${uid}_render_page

  - id: ${uid}_render_page
    mode: queued
    then:
      - lambda: |-
          auto split = [](const std::string &line) {
            std::vector<std::string> f;
            size_t s = 0;
            for (size_t p; (p = line.find('|', s)) != std::string::npos; s = p + 1) f.push_back(line.substr(s, p - s));
            f.push_back(line.substr(s));
            return f;
          };
          auto glyph = [](const std::string &cond) -> const char * {
            auto it = id(${uid}_icon_map).find(cond);
            return it != id(${uid}_icon_map).end() ? it->second.c_str() : "$mdi_alert_circle_outline";
          };
          static const char *const WD[7] = {"${ weekday_names | join('", "') }"};

          const auto &daily = id(${uid}_daily);
          const int n = daily.size();
          int d = id(${uid}_sel_day);
          if (d >= n) d = n - 1;
          if (d < 0) d = 0;
          id(${uid}_sel_day) = d;

          // ◀ / ▶ only where there is a day to go to
          if (d > 0)     lv_obj_remove_state(id(${uid}_prev), LV_STATE_DISABLED); else lv_obj_add_state(id(${uid}_prev), LV_STATE_DISABLED);
          if (d < n - 1) lv_obj_remove_state(id(${uid}_next), LV_STATE_DISABLED); else lv_obj_add_state(id(${uid}_next), LV_STATE_DISABLED);

          lv_obj_t *cards = id(${uid}_hours);
          lv_obj_clean(cards);
          lv_obj_set_flex_flow(cards, LV_FLEX_FLOW_ROW_WRAP);
          lv_obj_set_flex_align(cards, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START, LV_FLEX_ALIGN_START);
          lv_obj_set_style_pad_row(cards, 8, 0);
          lv_obj_set_style_pad_column(cards, 8, 0);
          if (n == 0) {
            lv_label_set_text(id(${uid}_title), "--");
            lv_label_set_text(id(${uid}_sum_icon), "");
            lv_label_set_text(id(${uid}_summary), "");
            return;
          }

          // ── Header: "date|weekday|condition|max|min|precip" ──
          const auto day = split(daily[d]);
          if (day.size() < 6) return;
          std::string name = WD[(atoi(day[1].c_str()) % 7 + 7) % 7];
          const char *today = "${today_label}";
          const char *tomorrow = "${tomorrow_label}";
          if (d == 0 && *today) name = today;
          if (d == 1 && *tomorrow) name = tomorrow;
          std::string title = "${date_format}";
          size_t p;
          if ((p = title.find("{weekday}")) != std::string::npos) title.replace(p, 9, name);
          if ((p = title.find("{day}")) != std::string::npos) title.replace(p, 5, std::to_string(atoi(day[0].c_str() + 8)));
          lv_label_set_text(id(${uid}_title), title.c_str());
          lv_label_set_text(id(${uid}_sum_icon), glyph(day[2]));
          const float day_pr = atof(day[5].c_str());
          char buf[64];
          if (day_pr > 0.04f)
            snprintf(buf, sizeof(buf), "%s° / %s°   %.1f %s", day[3].c_str(), day[4].c_str(), day_pr, id(${uid}_unit_precip).c_str());
          else
            snprintf(buf, sizeof(buf), "%s° / %s°", day[3].c_str(), day[4].c_str());
          lv_label_set_text(id(${uid}_summary), buf);

          // ── One card per hour of that day: "date|hour|condition|temp|precip|wind" ──
          auto mk_label = [](lv_obj_t *parent, const lv_font_t *font, uint32_t color, const char *text) {
            lv_obj_t *l = lv_label_create(parent);
            lv_obj_set_style_text_font(l, font, 0);
            lv_obj_set_style_text_color(l, lv_color_hex(color), 0);
            lv_label_set_text(l, text);
            return l;
          };
          int count = 0;
          for (const auto &line : id(${uid}_hourly)) {
            const auto h = split(line);
            if (h.size() < 6 || h[0] != day[0]) continue;
            lv_obj_t *card = lv_obj_create(cards);
            lv_obj_remove_style_all(card);
            lv_obj_set_size(card, ${card_width}, ${card_height});
            lv_obj_set_style_bg_color(card, lv_color_hex(${card_color}), 0);
            lv_obj_set_style_bg_opa(card, ${card_opa}, 0);
            lv_obj_set_style_radius(card, 12, 0);
            lv_obj_set_style_pad_all(card, 6, 0);
            lv_obj_remove_flag(card, (lv_obj_flag_t) (LV_OBJ_FLAG_SCROLLABLE | LV_OBJ_FLAG_CLICKABLE));
            lv_obj_set_flex_flow(card, LV_FLEX_FLOW_COLUMN);
            lv_obj_set_flex_align(card, LV_FLEX_ALIGN_SPACE_EVENLY, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_CENTER);

            snprintf(buf, sizeof(buf), "%02d:00", atoi(h[1].c_str()));
            mk_label(card, id(${hour_font})->get_lv_font(), ${dim_color}, buf);
            mk_label(card, id(${uid}_icons)->get_lv_font(), ${text_color}, glyph(h[2]));
            snprintf(buf, sizeof(buf), "%s°", h[3].c_str());
            mk_label(card, id(${temp_font})->get_lv_font(), ${text_color}, buf);
            const float pr = atof(h[4].c_str());
            if (pr > 0.04f) {
              snprintf(buf, sizeof(buf), "%.1f %s", pr, id(${uid}_unit_precip).c_str());
              mk_label(card, id(${small_font})->get_lv_font(), ${precip_color}, buf);
            }
            snprintf(buf, sizeof(buf), "%s %s", h[5].c_str(), id(${uid}_unit_wind).c_str());
            mk_label(card, id(${small_font})->get_lv_font(), ${dim_color}, buf);
            count++;
          }
          if (count == 0)
            mk_label(cards, id(${summary_font})->get_lv_font(), ${dim_color}, "${no_hourly_text}");
          lv_obj_scroll_to_y(cards, 0, LV_ANIM_OFF);

  - id: ${uid}_day_step
    parameters:
      delta: int
    then:
      - lambda: id(${uid}_sel_day) += delta;
      - script.execute: ${uid}_render_page


lvgl:
  pages:
  - id: !extend ${page_id}
    on_load:
      - script.execute: ${uid}_render_page
    widgets:
    - obj:
        id: ${uid}_wp
        width: 100%
        height: 100%
        bg_opa: TRANSP
        border_width: 0
        pad_all: ${pad_all | default(12)}
        scrollable: false
        layout:
          type: flex
          flex_flow: COLUMN
          pad_row: 10
        widgets:
          # ── Header: ◀  day + summary  ▶ ──
          - obj:
              width: 100%
              height: SIZE_CONTENT
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scrollable: false
              layout:
                type: flex
                flex_flow: ROW
                flex_align_cross: CENTER
                pad_column: 12
              widgets:
                - button:
                    id: ${uid}_prev
                    width: 64
                    height: 64
                    radius: 32
                    bg_color: 0x2C2C2E
                    shadow_width: 0
                    text_font: montserrat_28
                    text_color: 0xFFFFFF
                    text: ""            # LV_SYMBOL_LEFT
                    pressed:
                      bg_color: 0x48484A
                    disabled:
                      opa: 30%
                    on_click:
                      - script.execute:
                          id: ${uid}_day_step
                          delta: -1
                - obj:
                    flex_grow: 1
                    height: SIZE_CONTENT
                    bg_opa: TRANSP
                    border_width: 0
                    pad_all: 0
                    scrollable: false
                    layout:
                      type: flex
                      flex_flow: COLUMN
                      flex_align_cross: CENTER
                      pad_row: 2
                    widgets:
                      - label:
                          id: ${uid}_title
                          text: "--"
                          text_font: ${title_font}
                          text_color: ${text_color}
                      - obj:
                          width: SIZE_CONTENT
                          height: SIZE_CONTENT
                          bg_opa: TRANSP
                          border_width: 0
                          pad_all: 0
                          scrollable: false
                          layout:
                            type: flex
                            flex_flow: ROW
                            flex_align_cross: CENTER
                            pad_column: 10
                          widgets:
                            - label:
                                id: ${uid}_sum_icon
                                text: ""
                                text_font: ${uid}_icons
                                text_color: ${text_color}
                            - label:
                                id: ${uid}_summary
                                text: ""
                                text_font: ${summary_font}
                                text_color: ${text_color}
                - button:
                    id: ${uid}_next
                    width: 64
                    height: 64
                    radius: 32
                    bg_color: 0x2C2C2E
                    shadow_width: 0
                    text_font: montserrat_28
                    text_color: 0xFFFFFF
                    text: ""            # LV_SYMBOL_RIGHT
                    pressed:
                      bg_color: 0x48484A
                    disabled:
                      opa: 30%
                    on_click:
                      - script.execute:
                          id: ${uid}_day_step
                          delta: 1

          # ── Hourly cards (created by ${uid}_render_page) ──
          - obj:
              id: ${uid}_hours
              width: 100%
              flex_grow: 1
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scroll_dir: VER             # flex ROW_WRAP is set in ${uid}_render_page

          # ── Footer: home button bottom right ──
          - obj:
              width: 100%
              height: SIZE_CONTENT
              bg_opa: TRANSP
              border_width: 0
              pad_all: 0
              scrollable: false
              layout:
                type: flex
                flex_flow: ROW
                flex_align_main: END
              widgets:
                - button:
                    id: ${uid}_home_btn
                    height: 56
                    pad_left: 20
                    pad_right: 20
                    radius: 12
                    bg_color: 0x3A3A3C
                    shadow_width: 0
                    text_color: 0xFFFFFF
                    text_font: montserrat_20
                    text: "  ${home_label}"     # LV_SYMBOL_HOME
                    pressed:
                      bg_color: 0x48484A
                    on_click:
                      - lvgl.page.show: ${home_page}
