# Remote area tile (double) — shows two HA sensor values for an area,
# e.g. temperature + humidity, with an optional remote background image.
# Read-only: no action scripts, no detail page.
# Background image is downloaded from a URL (online_image) once the network
# is up; icons, label and values are drawn on top of it.
#
# vars:
#   uid:                    unique identifier
#   row:                    grid row
#   column:                 grid column
#   text:                   area name shown at the top (clipped, 80% width)
#   icon:                   icon glyph shown top left
#   row_span:               (default: 1)
#   column_span:            (default: 1)
#   page_id:                parent page                             (default: main_page)
#   bg_opa:                 background opacity. 0%-100% or TRANSP/COVER (default: COVER)
#
#   sensor_entity1:         first HA sensor entity, e.g. "sensor.living_room_temperature"
#   sensor_entity2:         second HA sensor entity
#   sensor_unit1:           unit appended to value 1                (default: "°C")
#   sensor_unit2:           unit appended to value 2                (default: "°C")
#   sensor_1_icon:          icon glyph in front of value 1
#   sensor_2_icon:          icon glyph in front of value 2
#   sensor_font:            font for both values                    (default: text_font)
#   label_font:             font for the area name                  (default: text_font)
#
#   image_url:              image URL (optional; if not set, no image is loaded)
#   image_format:           image format                            (default: AUTO)
#   image_width:            image width in px                       (default: 128)
#   image_height:           image height in px                      (default: 128)
#   image_update_interval:  re-download interval, e.g. "30min"      (default: never)
#   image_alignment:        image alignment inside the tile         (default: center)
#   image_x, image_y:       image offset                            (default: 0, 0)
#   image_opa:              image opacity. 0%-100% or TRANSP/COVER  (default: COVER)
#
#   icon_alignment:         (default: top_left)      icon_x, icon_y:         (default: 0, -10)
#   label_alignment:        (default: top_mid)       label_x, label_y:       (default: 15, -10)
#   icon_t1_alignment:      (default: left_mid)      icon_t1_x, icon_t1_y:   (default: 0, 0)
#   value_alignment:        (default: left_mid)      value_x, value_y:       (default: 0, 0)
#   icon_t2_alignment:      (default: bottom_left)   icon_t2_x, icon_t2_y:   (default: 0, 0)
#   value_sensor2_alignment:    (default: bottom_left)   value_sensor2_x, value_sensor2_y: (default: 0, 0)
#
# requires:
#   $icon_font, $icon_off_color, $label_off_color, $label_on_color, text_font (theme),
#   network connection, HA API connection
#
# notes:
#   - Values are shown with 1 decimal; "69.9 °C" is a placeholder until the
#     first value arrives.
#   - Icon and value share the same default alignment: set value_x /
#     value_sensor2_x to an offset, otherwise they overlap.
#   - For a percent unit use "%%" (e.g. sensor_unit2: "%%"), since the unit
#     is part of a printf format string.
#   - Download is attempted every 14 s until it succeeds; on error it retries.
#   - The image stays hidden until the first successful download.
#   - RAM: width x height x 3 bytes (RGB565 + alpha), 128x128 ≈ 48 kB.


globals:
- id: ${uid}_img_state          # 0 = pending, 1 = downloading, 2 = loaded
  type: uint8_t
  initial_value: '0'


http_request:

image:
- platform: online_image
  id: ${uid}_bg_image
  url: '${image_url | default("http://localhost/no_image.png")}'
  format: ${image_format | default("AUTO")}
  type: RGB565
  transparency: alpha_channel
  resize: ${image_width | default(128)}x${image_height | default(128)}
  update_interval: ${image_update_interval | default("never")}
  on_download_finished:
  - lambda: id(${uid}_img_state) = 2;
  - lvgl.image.update:
      id: img_${uid}
      src: ${uid}_bg_image
  - lvgl.widget.show: img_${uid}
  on_error:
  - lambda: id(${uid}_img_state) = 0;   # retry on next interval tick

# ── Initial download once the network is up (works with WiFi and Ethernet) ──
interval:
- interval: 14s
  then:
  - if:
      condition:
        lambda: |-
          return ${ 'true' if (image_url | default('')) != '' else 'false' } &&
                 id(${uid}_img_state) == 0 &&
                 network::is_connected();
      then:
      - lambda: id(${uid}_img_state) = 1;
      - component.update: ${uid}_bg_image



lvgl:
  pages:
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - container:
        id: ${uid}_tile
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_row_span: ${row_span | default(1)}
        grid_cell_column_span: ${column_span | default(1)}
        grid_cell_x_align: stretch
        grid_cell_y_align: stretch
        widgets:
        - button:
            bg_opa: ${bg_opa | default("COVER")}
#            bg_image_src: ${background}
#            bg_image_opa: ${bg_image_opa | default("40%")}
            id: button_${uid}
            clip_corner: true
            clickable: false
            widgets:
            - image:
                id: img_${uid}
                src: ${uid}_bg_image
                align: ${image_alignment | default("center")}
                opa: ${image_opa | default("COVER")}
                hidden: true             # shown after successful download
                y: ${image_y | default(0)}
                x: ${image_x | default(0)}
            # ICON
            - label:
                id: icon_${uid}
                text_font: $icon_font
                align: ${icon_alignment | default("top_left")}
                text_color: $icon_off_color
                text: ${icon}
                y: ${icon_y | default(-10)}
                x: ${icon_x | default(0)}
            # LABEL
            - label:
                id: label_${uid}
                align: ${label_alignment | default("top_mid")}
                long_mode: clip
                width: 80%
                text_color: $label_off_color
                text_font: ${label_font | default(text_font)}
                text: ${text}
                y: ${label_y | default(-10)}
                x: ${label_x | default(15)}
            # ICON-T1
            - label:
                id: icon_t1_${uid}
                text_font: $icon_font
                align: ${icon_t1_alignment | default("left_mid")}
                text_color: $icon_off_color
                text: ${sensor_1_icon}
                x: ${icon_t1_x | default(0)}
                y: ${icon_t1_y | default(0)}
            # TEMP 1
            - label:
                id: value_${uid}
                align: ${value_alignment | default("left_mid")}
                text_font: ${sensor_font | default(text_font)}
                text_color: $label_on_color
                text: "69.9 °C"
                y: ${value_y | default(0)}
                x: ${value_x | default(0)}
            # ICON-T2
            - label:
                id: icon_t2_${uid}
                text_font: $icon_font
                align: ${icon_t2_alignment | default("bottom_left")}
                text_color: $icon_off_color
                text: ${sensor_2_icon}
                y: ${icon_t2_y | default(0)}
                x: ${icon_t2_x | default(0)}
            # TEMP 2
            - label:
                id: value_sensor2_${uid}
                align: ${value_sensor2_alignment | default("bottom_left")}
                text_font: ${sensor_font | default(text_font)}
                text_color: $label_on_color
                text: "69.9 °C"
                x: ${value_sensor2_x | default(0)}
                y: ${value_sensor2_y | default(0)}                #y: +25
                

# ── Subscribe to the HA sensor state ─────────────────────────────────────────

sensor:
  - platform: homeassistant
    id: ${uid}_sensorvalue_1
    entity_id: ${sensor_entity1}
    on_value:
      then:
        - lvgl.label.update:
            id: value_${uid}
            text:
              format: "%.1f ${sensor_unit1 | default('°C')}"
              args: [ 'x' ]

  - platform: homeassistant
    id: ${uid}_sensorvalue_2
    entity_id: ${sensor_entity2}
    on_value:
      then:
        - lvgl.label.update:
            id: value_sensor2_${uid}
            text:
              format: "%.1f ${sensor_unit2 | default('°C')}"
              args: [ 'x' ]
