# Remote sensor tile with optional online background image.
# Displays a live value from a Home Assistant sensor entity.
# Read-only: no action scripts, no detail page.
# The background (colour/gradient and image) can switch depending on whether
# the value is above a threshold.
#
# vars:
#   uid:                   unique identifier
#   entity_id:             HA sensor entity, e.g. "sensor.outdoor_temperature"
#   attribute:             HA attribute to display instead of state (optional, default: state)
#   row:                   grid row
#   column:                grid column
#   text:                  sensor name shown on tile   (optional – label hidden if omitted)
#   icon:                  icon glyph                  (optional – icon hidden if omitted)
#   bg_opa:                background opacity. 0%-100% or TRANSP / COVER (optional, default: COVER)
#   unit:                  unit string appended to value, e.g. "°C" (optional, default "")
#   precision:             decimal places                           (optional, default 1)
#   row_span:              (default: 1)
#   column_span:           (default: 1)
#   page_id:               parent page (default: main_page)
#   label_font:            font for the label
#   sensor_font:           font for the sensor value
#
#   icon_alignment:        LVGL align of the icon  (default: top_left)
#   label_alignment:       LVGL align of the label (default: bottom_left)
#   value_alignment:       LVGL align of the value (default: top_right)
#
#   image_url:             URL of a PNG/JPEG background image (optional – no image if omitted)
#   image_width:           image is scaled to fit inside this width  (default: 128)
#   image_height:          image is scaled to fit inside this height (default: 128)
#                          (aspect ratio is preserved)
#   image_format:          AUTO | PNG | JPEG | BMP | QOI   (default: AUTO, needs a correct
#                          Content-Type from the server – set explicitly if decoding fails)
#   image_alignment:       LVGL align of the image (default: center)
#   image_opa:             opacity of the image, e.g. 60% to keep text readable (default: COVER)
#   image_update_interval: re-download interval, e.g. 15min (default: never = load once)
#
#   ── Value-dependent background ──
#   threshold:             value > threshold → "high" look, otherwise "low" look (default: 0)
#   bg_color_low:          background colour, low state   (default: $button_off_color)
#   bg_color_high:         background colour, high state  (default: same as bg_color_low)
#   bg_grad_color_low:     2nd gradient colour, low state  (default: same as bg_color_low)
#   bg_grad_color_high:    2nd gradient colour, high state (default: same as bg_color_high)
#   bg_grad_dir:           NONE | VER | HOR (default: NONE = solid colour)
#   image_url_high:        background image for the high state (optional – if omitted,
#                          image_url is shown in both states)
#
# Notes:
#   - Icon/label are always created but hidden when not passed (ESPHome packages
#     cannot omit widgets conditionally).
#   - Both online_images are always declared (they require a URL). Without a URL
#     they get a dummy URL and are never downloaded.
#   - The high look is implemented via the LVGL "checked" state of the tile button.
#   - Unavailable sensor (NaN) counts as "low".
#   - Requires http_request (declared below; settings in your main config win).

globals:
- id: ${uid}_current_value
  type: float
  initial_value: '0.0'
- id: ${uid}_is_high            # value currently above threshold?
  type: bool
  initial_value: 'false'
- id: ${uid}_img_state          # low/default image: 0 = pending, 1 = downloading, 2 = loaded
  type: uint8_t
  initial_value: '0'
- id: ${uid}_img_hi_state       # high image:        0 = pending, 1 = downloading, 2 = loaded
  type: uint8_t
  initial_value: '0'

http_request:

image:
- platform: online_image
  id: ${uid}_bg_image
  url: '${image_url | default("http://localhost/no_image.png")}'
  format: ${image_format | default("AUTO")}
  type: RGB565
  transparency: alpha_channel
  resize: ${image_width | default(128)}x${image_height | default(128)}
  update_interval: ${image_update_interval | default("never")}
  on_download_finished:
  - lambda: id(${uid}_img_state) = 2;
  - script.execute: ${uid}_sync_image
  on_error:
  - lambda: id(${uid}_img_state) = 0;   # retry on next interval tick

- platform: online_image
  id: ${uid}_bg_image_high
  url: '${image_url_high | default("http://localhost/no_image.png")}'
  format: ${image_format | default("AUTO")}
  type: RGB565
  transparency: alpha_channel
  resize: ${image_width | default(128)}x${image_height | default(128)}
  update_interval: ${image_update_interval | default("never")}
  on_download_finished:
  - lambda: id(${uid}_img_hi_state) = 2;
  - script.execute: ${uid}_sync_image
  on_error:
  - lambda: id(${uid}_img_hi_state) = 0;

# ── Initial downloads once the network is up (works with WiFi and Ethernet) ──
interval:
- interval: 12s
  then:
  - if:
      condition:
        lambda: |-
          return ${ 'true' if (image_url | default('')) != '' else 'false' } &&
                 id(${uid}_img_state) == 0 &&
                 network::is_connected();
      then:
      - lambda: id(${uid}_img_state) = 1;
      - component.update: ${uid}_bg_image
  - if:
      condition:
        # starts only when the first image is not downloading right now
        lambda: |-
          return ${ 'true' if (image_url_high | default('')) != '' else 'false' } &&
                 id(${uid}_img_hi_state) == 0 &&
                 id(${uid}_img_state) != 1 &&
                 network::is_connected();
      then:
      - lambda: id(${uid}_img_hi_state) = 1;
      - component.update: ${uid}_bg_image_high

lvgl:
  pages:
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - container:
        id: ${uid}_tile
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_row_span: ${row_span | default(1)}
        grid_cell_column_span: ${column_span | default(1)}
        grid_cell_x_align: stretch
        grid_cell_y_align: stretch
        widgets:
        - button:
            id: button_${uid}
            bg_opa: ${bg_opa | default("COVER")}
            # low look (default state)
            bg_color: ${bg_color_low | default(button_off_color)}
            bg_grad_color: ${bg_grad_color_low | default(bg_color_low | default(button_off_color))}
            bg_grad_dir: ${bg_grad_dir | default("NONE")}
            # high look (value > threshold)
            checked:
              bg_color: ${bg_color_high | default(bg_color_low | default(button_off_color))}
              bg_grad_color: ${bg_grad_color_high | default(bg_color_high | default(bg_color_low | default(button_off_color)))}
            clickable: false
            clip_corner: true            # clip image to the rounded tile corners
            widgets:
            # background image – first child, so it is drawn behind the labels
            - image:
                id: img_${uid}
                src: ${uid}_bg_image
                align: ${image_alignment | default("center")}
                opa: ${image_opa | default("COVER")}
                hidden: true             # shown after successful download
                y: ${image_y | default(0)}
                x: ${image_x | default(0)}
            - label:
                id: icon_${uid}
                hidden: "${ 'false' if (icon | default('')) != '' else 'true' }"
                align: ${icon_alignment | default("top_left")}
                text_font: $icon_font
                text_color: $icon_off_color
                text: ${icon | default('')}
                y: ${icon_y | default(0)}
                x: ${icon_x | default(0)}
            - label:
                id: label_${uid}
                hidden: "${ 'false' if (text | default('')) != '' else 'true' }"
                align: ${label_alignment | default("bottom_left")}
                long_mode: wrap
                width: 70%
                text_color: $label_off_color
                text_font: ${label_font | default(text_font)}
                text: ${text | default('')}
                y: ${label_y | default(0)}
                x: ${label_x | default(0)}
            - label:
                id: value_${uid}
                align: ${value_alignment | default("top_right")}
                text_font: ${sensor_font | default(text_font)}
                text_color: $label_on_color
                text: "--"
                y: ${value_y | default(0)}
                x: ${value_x | default(0)}

# ── Subscribe to the HA sensor state ─────────────────────────────────────────
sensor:
- platform: homeassistant
  id: ${uid}_ha_value
  entity_id: ${entity_id}
  attribute: ${attribute | default("")}
  internal: true
  on_value:
  - lambda: id(${uid}_current_value) = x;
  - script.execute: ${uid}_sync_state

script:
- id: ${uid}_sync_state
  then:
  - lvgl.label.update:
      id: value_${uid}
      text: !lambda |-
        char buf[32];
        snprintf(buf, sizeof(buf), "%.*f", ${precision | default(1)}, id(${uid}_current_value));
        std::string s(buf);
        std::string unit = "${unit | default("")}";
        if (!unit.empty()) s += " " + unit;
        return s;
  # switch background only when the value crosses the threshold
  - if:
      condition:
        lambda: |-
          bool high = id(${uid}_current_value) > ${threshold | default(0)};
          if (high == id(${uid}_is_high)) return false;
          id(${uid}_is_high) = high;
          return true;
      then:
      - script.execute: ${uid}_sync_background

- id: ${uid}_sync_background
  then:
  - if:
      condition:
        lambda: return id(${uid}_is_high);
      then:
      - lvgl.widget.update:
          id: button_${uid}
          state:
            checked: true
      else:
      - lvgl.widget.update:
          id: button_${uid}
          state:
            checked: false
  - script.execute: ${uid}_sync_image

# Picks the background image for the current state:
#   high + high image loaded → high image
#   otherwise default image loaded → default image (fallback)
#   otherwise → image hidden
- id: ${uid}_sync_image
  then:
  - if:
      condition:
        lambda: return id(${uid}_is_high) && id(${uid}_img_hi_state) == 2;
      then:
      - lvgl.image.update:
          id: img_${uid}
          src: ${uid}_bg_image_high
      - lvgl.widget.show: img_${uid}
      else:
      - if:
          condition:
            lambda: return id(${uid}_img_state) == 2;
          then:
          - lvgl.image.update:
              id: img_${uid}
              src: ${uid}_bg_image
          - lvgl.widget.show: img_${uid}
          else:
          - lvgl.widget.hide: img_${uid}