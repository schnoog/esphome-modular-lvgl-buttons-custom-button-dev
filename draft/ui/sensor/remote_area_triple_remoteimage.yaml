# Remote area tile (triple) — shows three HA sensor values for an area,
# e.g. temperature, humidity and air pressure, with an optional remote
# background image.
# Read-only: no action scripts, no detail page.
# Background image is downloaded from a URL (online_image) once the network
# is up; icon, label and values are drawn on top of it.
#
# vars:
#   uid:                    unique identifier
#   row:                    grid row
#   column:                 grid column
#   text:                   area name shown at the top (wraps, 70% width)
#   icon:                   icon glyph shown top left
#   row_span:               (default: 1)
#   column_span:            (default: 1)
#   page_id:                parent page                             (default: main_page)
#   bg_opa:                 background opacity. 0%-100% or TRANSP/COVER (default: COVER)
#   label_font:             font for the area name                  (default: text_font)
#
#   sensor1_entity:         first HA sensor entity, e.g. "sensor.living_room_temperature"
#   sensor2_entity:         second HA sensor entity
#   sensor3_entity:         third HA sensor entity
#   sensor1_unit:           unit appended to value 1                (default: "°C")
#   sensor2_unit:           unit appended to value 2                (default: "%%")
#   sensor3_unit:           unit appended to value 3                (default: "hPa")
#   sensor1_font:           font for value 1                        (default: text_font)
#   sensor2_font:           font for value 2                        (default: text_font)
#   sensor3_font:           font for value 3                        (default: text_font)
#
#   image_url:              image URL (optional; if not set, no image is loaded)
#   image_format:           image format                            (default: AUTO)
#   image_width:            image width in px                       (default: 128)
#   image_height:           image height in px                      (default: 128)
#   image_update_interval:  re-download interval, e.g. "30min"      (default: never)
#   image_alignment:        image alignment inside the tile         (default: center)
#   image_x, image_y:       image offset                            (default: 0, 0)
#   image_opa:              image opacity. 0%-100% or TRANSP/COVER  (default: COVER)
#
#   icon_alignment:         (default: top_left)      icon_x, icon_y:       (default: 0, 0)
#   label_alignment:        (default: top_mid)       label_x, label_y:     (default: 0, 0)
#   value_1_alignment:      (default: left_mid)      value_1_x, value_1_y: (default: 0, 0)
#   value_2_alignment:      (default: right_mid)     value_2_x, value_2_y: (default: 0, 0)
#   value_3_alignment:      (default: bottom_right)  value_3_x, value_3_y: (default: 0, 0)
#
# requires:
#   $icon_font, $icon_off_color, $label_off_color, $label_on_color, text_font (theme),
#   network connection, HA API connection
#
# notes:
#   - Values are shown with 1 decimal; "69.9 °C", "12.3 %" and "765.4 hPa"
#     are placeholders until the first value arrives.
#   - For a percent unit use "%%", since the unit is part of a printf
#     format string.
#   - Download is attempted every 16 s until it succeeds; on error it retries.
#   - The image stays hidden until the first successful download.
#   - RAM: width x height x 3 bytes (RGB565 + alpha), 128x128 ≈ 48 kB.


globals:
- id: ${uid}_current_value
  type: float
  initial_value: '0.0'
- id: ${uid}_img_state          # 0 = pending, 1 = downloading, 2 = loaded
  type: uint8_t
  initial_value: '0'


http_request:

image:
- platform: online_image
  id: ${uid}_bg_image
  url: '${image_url | default("http://localhost/no_image.png")}'
  format: ${image_format | default("AUTO")}
  type: RGB565
  transparency: alpha_channel
  resize: ${image_width | default(128)}x${image_height | default(128)}
  update_interval: ${image_update_interval | default("never")}
  on_download_finished:
  - lambda: id(${uid}_img_state) = 2;
  - lvgl.image.update:
      id: img_${uid}
      src: ${uid}_bg_image
  - lvgl.widget.show: img_${uid}
  on_error:
  - lambda: id(${uid}_img_state) = 0;   # retry on next interval tick

# ── Initial download once the network is up (works with WiFi and Ethernet) ──
interval:
- interval: 16s
  then:
  - if:
      condition:
        lambda: |-
          return ${ 'true' if (image_url | default('')) != '' else 'false' } &&
                 id(${uid}_img_state) == 0 &&
                 network::is_connected();
      then:
      - lambda: id(${uid}_img_state) = 1;
      - component.update: ${uid}_bg_image



lvgl:
  pages:
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - container:
        id: ${uid}_tile
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_row_span: ${row_span | default(1)}
        grid_cell_column_span: ${column_span | default(1)}
        grid_cell_x_align: stretch
        grid_cell_y_align: stretch
        widgets:
        - button:
            bg_opa: ${bg_opa | default("COVER")}
            clip_corner: true
#            bg_image_src: ${background}
#            bg_image_opa: ${bg_image_opa | default("40%")}
            id: button_${uid}
            clickable: false
            widgets:
            - image:
                id: img_${uid}
                src: ${uid}_bg_image
                align: ${image_alignment | default("center")}
                opa: ${image_opa | default("COVER")}
                hidden: true             # shown after successful download
                y: ${image_y | default(0)}
                x: ${image_x | default(0)}
            - label:
                id: icon_${uid}
                text_font: $icon_font
                align: ${icon_alignment | default("top_left")}
                text_color: $icon_off_color
                text: ${icon}
                y: ${icon_y | default(0)}
                x: ${icon_x | default(0)}
            - label:
                id: label_${uid}
                align: ${label_alignment | default("top_mid")}
                long_mode: wrap
                width: 70%
                text_color: $label_off_color
                text_font: ${label_font | default(text_font)}
                text: ${text}
                y: ${label_y | default(0)}
                x: ${label_x | default(0)}
            - label:
                id: value_1_${uid}
                align: ${value_1_alignment | default("left_mid")}
                text_font: ${sensor1_font | default(text_font)}
                text_color: $label_on_color
                text: "69.9 °C"
                y: ${value_1_y | default(0)}
                x: ${value_1_x | default(0)}
            - label:
                id: value_2_${uid}
                align: ${value_2_alignment | default("right_mid")}
                text_font: ${sensor2_font | default(text_font)}
                text_color: $label_on_color
                text: "12.3 %"
                y: ${value_2_y | default(0)}
                x: ${value_2_x | default(0)}
            - label:
                id: value_3_${uid}
                align: ${value_3_alignment | default("bottom_right")}
                text_font: ${sensor3_font | default(text_font)}
                text_color: $label_on_color
                text: "765.4 hPa"
                y: ${value_3_y | default(0)}
                x: ${value_3_x | default(0)}
# ── Subscribe to the HA sensor state ─────────────────────────────────────────

sensor:
  - platform: homeassistant
    id: ${uid}_sensor1val
    entity_id: ${sensor1_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: value_1_${uid}
            text:
              format: "%.1f ${sensor1_unit | default('°C')}"
              args: [ 'x' ]

  - platform: homeassistant
    id: ${uid}_sensor2val
    entity_id: ${sensor2_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: value_2_${uid}
            text:
              format: "%.1f ${sensor2_unit | default('%%')}"
              args: [ 'x' ]

  - platform: homeassistant
    id: ${uid}_sensor3val
    entity_id: ${sensor3_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: value_3_${uid}
            text:
              format: "%.1f ${sensor3_unit | default('hPa')}"
              args: [ 'x' ]