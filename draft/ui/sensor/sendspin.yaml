# ══════════════════════════════════════════════════════════════════════════════
#  Sendspin Now-Playing Tile
#  Shows cover art, title, artist and album of the current Sendspin group
#  (e.g. Music Assistant) inside a single grid tile.
# ══════════════════════════════════════════════════════════════════════════════
#
#  Usage:
#    packages:
#      now_playing: !include
#        file: draft/ui/sensor/sendspin.yaml
#        vars:
#          uid: now_playing
#          page_id: music_page
#          row: 0
#          column: 0
#          column_span: 2
#
#  Required vars:
#    uid                  Unique prefix for all IDs of this tile
#    row, column          Grid position on the page
#
#  Optional vars:         (default)
#    page_id              main_page      Page the tile is added to
#    row_span             1
#    column_span          1
#    image_width          60             Cover size in px, requested from server
#    image_height         60
#    image_alignment      left_mid
#    image_x, image_y     0, 6           Cover offset
#    title_alignment      top_right
#    artist_alignment     right_mid
#    artist_x, artist_y   0, 0           Artist label offset
#    album_alignment      bottom_right
#    text_max_width       60%            Width of all three text labels
#    label_font_title     text_font
#    label_font_artist    text_font
#    label_font_album     text_font
#
#    bg_color             $button_off_color  Background colour
#    bg_grad_dir          NONE           NONE | VER | HOR (NONE = plain colour)
#    bg_grad_color        bg_color       Second gradient colour
#    bg_main_stop         0              0..255, where bg_color starts to fade
#    bg_grad_stop         255            0..255, where bg_grad_color is reached
#
#
#  Exposed IDs:
#    ${uid}_tile, button_${uid}, ${uid}_cover_widget, ${uid}_album_slot,
#    ${uid}_album_art, value_title_${uid}, value_artist_${uid},
#    value_album_${uid}, ${uid}_sync_state
# ═════════════════════════════════════════════


globals:
- id: ${uid}_current_title
  type: std::string
  initial_value: '""'
- id: ${uid}_current_artist
  type: std::string
  initial_value: '""'
- id: ${uid}_current_album
  type: std::string
  initial_value: '""'
- id: ${uid}_sendspin_album_art_valid
  type: bool
  restore_value: no
  initial_value: "false"

sendspin:
  id: ${uid}_sendspin_hub



text_sensor:
  - platform: sendspin
    name: ${uid}_senspin_title
    id: ${uid}_sendspin_title
    type: title
    on_value:
      - logger.log:
          format: "Titel: %s"
          args: [ 'x.c_str()' ]
      - lambda: id(${uid}_current_title) = x;
      - script.execute: ${uid}_sync_state




  - platform: sendspin
    id: ${uid}_sendspin_artist
    name: ${uid}_sendspin_artist
    type: artist
    on_value:
      - logger.log:
          format: "Interpret: %s"
          args: [ 'x.c_str()' ]
      - lambda: id(${uid}_current_artist) = x;
      - script.execute: ${uid}_sync_state



  - platform: sendspin
    id: ${uid}_sendspin_album
    type: album
    name: ${uid}_sendspin_album
    on_value:
      - logger.log:
          format: "Album: %s"
          args: [ 'x.c_str()' ]    
      - lambda: id(${uid}_current_album) = x;
      - script.execute: ${uid}_sync_state


image:
  - platform: file
    id: ${uid}_fallback_image
    file: ${fallback_image | default("https://raw.githubusercontent.com/RealDeco/xiaozhi-esphome/main/images/HA-character/240x240/playing.png")}
    resize: ${image_width | default(60)}x${image_height | default(60)}
    type: RGB565
    dither: NONE

  - platform: sendspin
    id: ${uid}_album_slot
    format: JPEG
    type: RGB565
    resize: ${image_width | default(60)}x${image_height | default(60)}
    source: album
    display_offset: ${fade_offset | default("1s")}
    current_image:
      id: ${uid}_album_art
    transition_image:
      id: ${uid}_album_art_transition
    on_image_display:
      - logger.log: "Cover: display"
      # Outgoing = previous cover, or fallback if none was shown yet
      - if:
          condition:
            lambda: 'return id(${uid}_sendspin_album_art_valid);'
          then:
            - lvgl.image.update:
                id: ${uid}_cover_outgoing
                src: ${uid}_album_art_transition
          else:
            - lvgl.image.update:
                id: ${uid}_cover_outgoing
                src: ${uid}_fallback_image
      - lambda: id(${uid}_sendspin_album_art_valid) = true;
      - lvgl.image.update:
          id: ${uid}_cover_widget
          src: ${uid}_album_art
      - lvgl.animation.start: ${uid}_cover_crossfade
    on_image_clear:
      - logger.log: "Cover: clear"
      - lambda: id(${uid}_sendspin_album_art_valid) = false;
      - lvgl.image.update:
          id: ${uid}_cover_outgoing
          src: ${uid}_album_art_transition
      - lvgl.image.update:
          id: ${uid}_cover_widget
          src: ${uid}_fallback_image
      - lvgl.animation.start: ${uid}_cover_fade_out
    on_image_error:
      - logger.log:
          level: WARN
          format: "Cover: Fehler"



lvgl:
  animations:
    - id: ${uid}_cover_crossfade
      duration: ${fade_duration | default("2s")}
      widgets:
        - id: ${uid}_cover_outgoing
          opa:
            from: 100%
            to: 0%
      on_stop:
        - sendspin.image.transition_finished: ${uid}_album_slot
    - id: ${uid}_cover_fade_out
      duration: ${fade_duration | default("2s")}
      widgets:
        - id: ${uid}_cover_outgoing
          opa:
            from: 100%
            to: 0%
  pages:
  - id: !extend ${page_id | default("main_page")}
    widgets:
    - container:
        id: ${uid}_tile
        grid_cell_row_pos: ${row}
        grid_cell_column_pos: ${column}
        grid_cell_row_span: ${row_span | default(1)}
        grid_cell_column_span: ${column_span | default(1)}
        grid_cell_x_align: stretch
        grid_cell_y_align: stretch
        widgets:
        - button:
            id: button_${uid}
            bg_opa: ${bg_opa | default("COVER")}
            bg_color: ${bg_color | default(button_off_color)}
            bg_grad_color: ${bg_grad_color | default(bg_color | default(button_off_color))}
            bg_grad_dir: ${bg_grad_dir | default("NONE")}
            bg_main_stop: ${bg_main_stop | default(0)}
            bg_grad_stop: ${bg_grad_stop | default(255)}
            clickable: false
            widgets:
            - image:                       # incoming / current cover
                id: ${uid}_cover_widget
                align: ${image_alignment | default("left_mid")}
                x: ${image_x | default(6)}
                y: ${image_y | default(6)}
                src: ${uid}_fallback_image
            - image:                       # outgoing, fades out on top
                id: ${uid}_cover_outgoing
                align: ${image_alignment | default("left_mid")}
                x: ${image_x | default(6)}
                y: ${image_y | default(6)}
                src: ${uid}_fallback_image
                opa: 0%
            - label:
                id: value_title_${uid}
                align:  ${title_alignment | default("top_right")}  
                long_mode: ${title_long_mode | default("wrap")} 
                width: ${text_max_width_title | default("60%")} 
                x: ${title_x | default(0)}
                y: ${title_y | default(0)}                
                text_color: $label_off_color
                text_font: ${label_font_title | default(text_font)}
                text: ""
            - label:
                id: value_artist_${uid}
                align: ${artist_alignment | default("right_mid")}
                long_mode: ${artist_long_mode | default("SCROLL")} 
                width: ${text_max_width_artist | default("60%")}
                y: ${artist_y | default(0)}
                x: ${artist_x | default(0)}                
                text_color: $label_off_color
                text_font: ${label_font_artist | default(text_font)}
                text: ""
            - label:
                id: value_album_${uid}
                align: ${album_alignment | default("bottom_right")}
                long_mode: ${album_long_mode | default("SCROLL")}
                width: ${text_max_width_album | default("60%")}
                text_color: $label_off_color
                text_font: ${label_font_album | default(text_font)}
                text: ""                


# ── Hook into the sensor's value changes ──────────────────────────────────────




script:
  - id: ${uid}_sync_state
    then:
      - lvgl.label.update:
          id: value_title_${uid}
          text: !lambda return id(${uid}_current_title);
      - lvgl.label.update:
          id: value_artist_${uid}
          text: !lambda return id(${uid}_current_artist);
      - lvgl.label.update:
          id: value_album_${uid}
          text: !lambda return id(${uid}_current_album);