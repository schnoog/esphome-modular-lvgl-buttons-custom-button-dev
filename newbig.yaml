# 
# https://design.dev/tools/ascii-code-generator/
# Substitution variables used through the codebase
substitutions:
  icon_font: mdi_icons_40
  text_font: nunito_20
  text_color: white
  bg_color: black
  button_on_color: "ep_orange"
  button_off_color: "very_dark_gray"
  icon_on_color: "yellow"
  icon_off_color: "gray"
  label_on_color: "white"
  label_off_color: "gray"
  button_text_color: "white"
  
  glyphsets: "GF_Latin_Core"

  # LCD back light modes - Code in backlight_time.yaml
  display_daytime_brightness: "100%"
  display_nighttime_brightness: "50%"
  display_night_hour: "0"      # Hour for night mode (0-23)
  display_night_minute: "0"    # Minute for night mode (0-59)
  display_backlight_timeout_always_enabled: "false"  # Set true to dim/off in all modes, not just Night
  display_backlight_timeout_initial: "5"  # Initial backlight timeout in minutes (-1 to disable)
  # defaults for popup pages
  popup_timeout_seconds: '120'  # timeout in seconds  

  # Grafiken (Menü-Kacheln aktiv, andere Kacheln auskommentiert)
  img_base: "http://192.168.178.119:8123/local/images"

  # ── Farbverläufe der Kacheln (oben → unten), passend zum Seitenverlauf ──
  grad_klima_top: "0x2A3A5C"      # Klima: Stahlblau → Navy
  grad_klima_bottom: "0x18213A"
  grad_heizung_top: "0x4A2E2A"    # Heizung: Kupfer → Dämmer-Violett
  grad_heizung_bottom: "0x2B2442"
  grad_feuer_top: "0x7A3A14"      # Brenner an: Glut
  grad_feuer_bottom: "0x2B2442"
  grad_wasser_top: "0x24506A"     # Warmwasser: Wasserblau
  grad_wasser_bottom: "0x18213A"
  grad_tag_top: "0x5A4A26"        # Tag / Sommer: Gold → Violett
  grad_tag_bottom: "0x2B2442"
  grad_nacht_top: "0x1E2448"      # Nacht: Indigo → Nachtblau
  grad_nacht_bottom: "0x0A0F1E"
  grad_winter_top: "0x2A4A6A"     # Winter: Eisblau → Navy
  grad_winter_bottom: "0x18213A"
  grad_media_top: "0x45325E"      # Medien: Violett → tiefes Violett
  grad_media_bottom: "0x221D38"
  grad_radio_top: "0x3A2E5C"      # Radio: Blauviolett → Navy
  grad_radio_bottom: "0x18213A"
  grad_avr_top: "0x2E3448"        # AV-Receiver/TV: Graphitblau
  grad_avr_bottom: "0x141820"
  grad_cam_top: "0x2A2A30"        # Kamera: Graphit → Schwarz
  grad_cam_bottom: "0x141418"
  grad_strom_top: "0x2C5A6A"      # Strom: Petrol → Navy
  grad_strom_bottom: "0x18213A"
  grad_solar_top: "0x5A4A26"      # Solar: Gold → Violett
  grad_solar_bottom: "0x2B2442"
  grad_laden_top: "0x2C5A3A"      # Akku laden / Einspeisung: Grün
  grad_laden_bottom: "0x18213A"
  grad_entladen_top: "0x5A3426"   # Akku entladen / Netzbezug: Kupfer
  grad_entladen_bottom: "0x2B2442"

esphome:
  name: "bigdisplay"
  friendly_name: "MyNewBigDisplay"
  comment: "MyNewBigDisplay"
#  platformio_options:
#    build_flags:
#      - "-D LV_USE_CHART=1"

  on_boot:
    - priority: 400
      then:
        - script.execute: update_loading_page


# esp_hosted (WLAN-Koprozessor über SDIO): Transportpuffer bevorzugt in den PSRAM.
# Ohne das reicht das interne RAM beim Booten nicht mehr
# ("HS_MP: mempool create failed: no mem" → assert in sdio_drv.c).
esp32:
  framework:
    sdkconfig_options:
      CONFIG_ESP_HOSTED_MEMPOOL_PREFER_SPIRAM: y


api:
  encryption:
    key: !secret api_encryption_key


      
logger:
  level: debug
  logs:
    lvgl: info
  hardware_uart: UART0




button:
  - platform: template
    name: "Display vorherige Seite"
    icon: "mdi:arrow-left"
    on_press:
      - lvgl.page.previous

  - platform: template
    name: "Display nächste Seite"
    icon: "mdi:arrow-right"
    on_press:
      - lvgl.page.next

