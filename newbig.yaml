switch:
  # Controls panel power for LCD and touch
#  - platform: gpio
#    pin: GPIO29
#    id: display_power
#    name: "Display Power"
#    restore_mode: ALWAYS_ON

  # Amplifier power (active‑low on this board)

  # Microphone routing switch (R/L channel selection on the board)


media_source:
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000



media_player:
  - platform: speaker_source
    name: "Media Player"
    id: my_media_player
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
      sources:
        - http_announcement_source
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      sources:
        - http_media_source
###        - sendspin_media_source
    volume_increment: 0.05
    volume_min: 0.5
    volume_max: 0.75






# This is the main LVGL section. We start with a simple grid.
lvgl:
  buffer_size: 100%

  gradients:
    - id: page_bg_grad
      direction: VER          # oben → unten
      dither: ORDERED         # verhindert Streifenbildung bei RGB565
      stops:
        - color: 0x2B2442     # Dämmer-Violett (Echo des Kupfertons)
          position: 0
        - color: 0x18213A     # Navy, passend zu den Kacheln
          position: 110
        - color: 0x0A0F1E     # Nachtblau
          position: 255
  pages:
    - id: main_page
      layout: 4x8
      styles: page_style
      bg_color: 0x18213A      # Fallback
      bg_opa: COVER
      bg_grad: page_bg_grad
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml


    - id: media_page
      layout: 4x8
      styles: page_style
      bg_color: 0x18213A      # Fallback
      bg_opa: COVER
      bg_grad: page_bg_grad
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      


    - id: heating_page
      layout: 4x8
      styles: page_style
      bg_color: 0x18213A      # Fallback
      bg_opa: COVER
      bg_grad: page_bg_grad
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      



    - id: solar_page
      layout: 4x8
      styles: page_style
      bg_color: 0x18213A      # Fallback
      bg_opa: COVER
      bg_grad: page_bg_grad
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      
      widgets:
        # You can use the package section above to add prebuilt button types or build your own custom button from scratch here.
        - container:
            id: sendspinbutton_solar
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            grid_cell_row_pos: 0
            grid_cell_column_pos: 4
            grid_cell_row_span: 1
            grid_cell_column_span: 2
      #      outline_width: 1   # debug code - This is for visualizing boundaries remove for production
      #      outline_color: red  # debug code - This is for visualizing boundaries remove for production
            widgets:
              - label:
                  id: sendspin_title_label_solar
                  text: "Titel"
                  text_font: nunito_24
                  align: top_right

              - label:
                  id: sendspin_artist_label_solar
                  text: "Artist"
                  text_font: nunito_24                  
                  align: right_mid
                  

              # Album
              - label:
                  id: sendspin_album_label_solar
                  text: ""
                  text_font: nunito_24                  
                  align: bottom_right


    - id: cal_page
      styles: page_style
      bg_color: 0x18213A      # Fallback
      bg_opa: COVER
      bg_grad: page_bg_grad
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      
      widgets:
        - !include
          file: draft/ui/calendar/calendar_widget.yaml   # Pfad relativ zur Hauptdatei anpassen
          vars:
            weekday_names: ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"]
            title_placeholder: "Kalender"
            events_placeholder: "Termine"
            home_page: main_page
            home_label: "Start"


    - id: cam_page
      layout: 4x6 
      styles: page_style
      bg_color: 0x18213A      # Fallback
      bg_opa: COVER
      bg_grad: page_bg_grad
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      





  top_layer:
    widgets:
      - obj:
          id: incoming_call_popup
          hidden: true
          width: 880
          height: 440
          align: CENTER
          radius: 12
          bg_color: 0x1E1E1E
          bg_opa: COVER
          border_width: 2
          border_color: 0x00AAFF
          widgets:
#mdi_phone

            - label:
                text: "Eingehender Anruf"
                text_font: nunito_48   # an deine geladenen Fonts anpassen
                align: CENTER
                y: -100

            - label:
                id: icon_phone
                text_font: mdi_icons_40
                align: CENTER
#                x: 0
                y: -20
                text: $mdi_phone
          

            - label:
                id: caller_id_label
                text: "..."
                text_font: nunito_48
                align: CENTER
                y: 50
 #               x: 20
            # Falls die Komponente Answer/Hangup-Actions bietet:
            - button:
              #  x: -20
                y: -15
                width: 120
                height: 50                
                align: BOTTOM_MID
                widgets:
                  - label:
                      text: "Ablehnen"
                on_click:
                  - lambda: |-
                      // id(sip).hangup();  // Methode/Signatur prüfen!
                  - lvgl.widget.hide: incoming_call_popup



