      $mdi_white_balance_sunny  # mdi-white-balance-sunny - color temp/sun icon
    ]

  # Kleine Icons für die 4-Zeilen-Heizungskachel (heating_card)
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf'
    id: mdi_icons_24
    size: 24
    bpp: 8
    glyphs: [
      $mdi_water_boiler,
      $mdi_gauge,
      $mdi_fire,
      $mdi_fire_off,
    ]


# Kachel-Grafiken kommen jetzt als online_image von ${img_base}; der frühere
# image:-Block mit lokalen Dateien (images/*.png) wird nicht mehr gebraucht.


debug:
  update_interval: 10s

sensor:
  - platform: debug
    free:
      name: "Heap frei"
    block:
      name: "Heap größter Block"
    psram:
      name: "PSRAM frei"
    loop_time:
      name: "Loop Time"

  # MCU-Temperatur in °C statt °F: Der Sensor aus sensors_base.yaml (Bibliothek)
  # rechnet fest in °F um – hier entfernt und in °C neu angelegt.
  - id: !remove cpu_temperature
  - platform: internal_temperature
    id: cpu_temperature_c
    name: "CPU Temperature"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: mdi:thermometer
    entity_category: diagnostic
