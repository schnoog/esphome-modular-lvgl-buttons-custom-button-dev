# =====================================================================
#  newbig – Seite "solar_page" (Strom / Solar)
#  Eingebunden in newbig.yaml unter packages: (Reihenfolge = Wisch-Reihenfolge).
#  Pfade sind relativ zu dieser Datei (../../draft/…, ../../esphome-modular-lvgl-buttons/…);
#  Farben ($grad_*) und ${img_base} kommen aus den substitutions in newbig.yaml.
# =====================================================================

packages:
#  ____                  _  _                  _
# |  _ \ __ _  __ _  ___| || |       ___  ___ | | __ _ _ __
# | |_) / _` |/ _` |/ _ \ || |_     / __|/ _ \| |/ _` | '__|
# |  __/ (_| | (_| |  __/__   _|    \__ \ (_) | | (_| | |
# |_|   \__,_|\__, |\___|  |_|      |___/\___/|_|\__,_|_|
#             |___/

# ##PAGE4

  clock_solar: !include
    file: ../../draft/ui/clock/daytime_gradient_clock.yaml
    vars:
      uid: clock_solar
      row: 0
      column: 6
      column_span: 2
      page_id: "solar_page"
      weekday_names: ["Montag", "Dienstag", "Mittwoch", "Donnerstag",
                      "Freitag", "Samstag", "Sonntag"]
      date_format: "{weekday}, {day}."
      date_font: nunito_24
      time_font: nunito_72
      time_y: 14

  power_solar_currpower_btn: !include
    file: ../../draft/ui/sensor/remote_remoteimage.yaml
    vars:
      uid: power_solar_currpower
      entity_id: "sensor.hm_power"
      row: 0
      column: 0
      column_span: 2
      text: "Solar Dach"
      icon: $mdi_solar_power
      unit: "W"
      precision: 0
      sensor_font: "nunito_36"
      value_alignment: bottom_right
      page_id: "solar_page"
      bg_grad_dir: VER
      bg_color: $grad_solar_top
      bg_grad_color: $grad_solar_bottom
      image_url: "${img_base}/solar_aktuell_mc.png"
      image_format: PNG
      image_width: 256
      image_height: 150
      label_alignment: right_mid
      icon_alignment: bottom_mid

  power_solar_currpspower_btn: !include
    file: ../../draft/ui/sensor/remote_remoteimage.yaml
    vars:
      uid: power_solar_currpspower
      entity_id: "sensor.solarbank_2_e1600_ac_solarleistung"
      row: 0
      column: 2
      column_span: 2
      text: "Solar Speicher"
      icon: $mdi_solar_power
      unit: "W"
      precision: 0
      sensor_font: "nunito_36"
      value_alignment: bottom_right
      page_id: "solar_page"
      bg_grad_dir: VER
      bg_color: $grad_solar_top
      bg_grad_color: $grad_solar_bottom
      image_url: "${img_base}/solarleistung_ps.png"
      image_format: PNG
      image_width: 256
      image_height: 150
      label_alignment: right_mid
      icon_alignment: bottom_mid


  power_hausabgabe_btn: !include
    file: ../../draft/ui/sensor/remote_remoteimage.yaml
    vars:
      uid: power_hausabgabe
      entity_id: "sensor.solarbank_2_e1600_ac_ac_hausabgabe"
      row: 1
      column: 0
      column_span: 2
      text: "Hausabgabe"
      icon: $mdi_power_socket_eu
      unit: "W"
      precision: 0
      sensor_font: "nunito_36"
      value_alignment: bottom_right
      page_id: "solar_page"
      bg_grad_dir: VER
      bg_color: $grad_strom_top
      bg_grad_color: $grad_strom_bottom
      image_url: "${img_base}/hauseinspeisung.png"
      image_format: PNG
      image_width: 256
      image_height: 150
      label_alignment: right_mid
      icon_alignment: bottom_mid

  power_hausabgabelimit_btn: !include
    file: ../../draft/ui/sensor/remote_remoteimage.yaml
    vars:
      uid: power_ehausabgabelimit
      entity_id: "number.solarbank_2_e1600_ac_system_lastvorgabe"
      row: 1
      column: 2
      column_span: 2
      text: "Abgabelimit"
      icon: $mdi_power_socket_eu
      unit: "W"
      precision: 0
      sensor_font: "nunito_36"
      value_alignment: bottom_right
      page_id: "solar_page"
      bg_grad_dir: VER
      bg_color: $grad_strom_top
      bg_grad_color: $grad_strom_bottom
      image_url: "${img_base}/hauseinspeisungslimit.png"
      image_format: PNG
      image_width: 256
      image_height: 150
      label_alignment: right_mid
      icon_alignment: bottom_mid

  power_akkustand_btn: !include
    file: ../../draft/ui/sensor/remote_remoteimage.yaml
    vars:
      uid: power_akkustand
      entity_id: "sensor.solarbank_2_e1600_ac_ladestand"
      row: 1
      column: 4
      column_span: 2
      text: "Akku"
      unit: "%"
      precision: 0
      sensor_font: "nunito_36"
      value_alignment: bottom_right
      page_id: "solar_page"
      bg_grad_dir: VER
      bg_color: $grad_strom_top
      bg_grad_color: $grad_strom_bottom
      image_url: "${img_base}/akkuladestand.png"
      image_format: PNG
      image_width: 256
      image_height: 150
      label_alignment: right_mid
      icon_alignment: bottom_mid



  # Akku: > 0 W = Laden (grün), sonst Entladen (kupfer)
  power_akkunet_btn: !include
    file: ../../draft/ui/sensor/remote_numeric_imageswitch_remoteimages.yaml
    vars:
      uid: power_akkunet
      entity_id: "sensor.solarbank_2_e1600_ac_akkuleistung"
      row: 1
      column: 6
      column_span: 2
      text: "Akku Leistung"
      unit: "W"
      precision: 0
      sensor_font: "nunito_36"
      value_alignment: bottom_right
      page_id: "solar_page"
      threshold: 0
      bg_grad_dir: VER
      bg_color_low: $grad_entladen_top
      bg_grad_color_low: $grad_entladen_bottom
      bg_color_high: $grad_laden_top
      bg_grad_color_high: $grad_laden_bottom
      image_url: "${img_base}/akku_entladeleistung.png"
      image_url_high: "${img_base}/akku_ladeleistung.png"
      image_format: PNG
      image_width: 256
      image_height: 150
      label_alignment: right_mid
      icon_alignment: bottom_mid




  # Zähler: > 0 W = Netzbezug (kupfer), sonst Einspeisung (grün)
  power_einspeisung_btn: !include
    file: ../../draft/ui/sensor/remote_numeric_imageswitch_remoteimages.yaml
    vars:
      uid: power_einspeisung
      entity_id: "sensor.stromzahler_momentanwirkleistung"
      row: 2
      column: 0
      column_span: 2
      text: "Netz"
      unit: "W"
      precision: 0
      sensor_font: "nunito_36"
      value_alignment: bottom_right
      page_id: "solar_page"
      threshold: 0
      bg_grad_dir: VER
      bg_color_low: $grad_laden_top
      bg_grad_color_low: $grad_laden_bottom
      bg_color_high: $grad_entladen_top
      bg_grad_color_high: $grad_entladen_bottom
      image_url: "${img_base}/netzeinspeisung.png"
      image_url_high: "${img_base}/netzbezug_aktuell.png"
      image_format: PNG
      image_width: 256
      image_height: 150
      label_alignment: right_mid
      icon_alignment: bottom_mid


  power_aktverbrauch_btn: !include
    file: ../../draft/ui/sensor/remote_remoteimage.yaml
    vars:
      uid: power_aktverbrauch
      entity_id: "sensor.keller_stromzahler_momentaner_gesamtverbrauch"
      row: 2
      column: 2
      column_span: 2
      text: "Verbrauch"
      icon: $mdi_power_socket_eu
      unit: "W"
      precision: 0
      sensor_font: "nunito_36"
      value_alignment: bottom_right
      page_id: "solar_page"
      bg_grad_dir: VER
      bg_color: $grad_strom_top
      bg_grad_color: $grad_strom_bottom
      image_url: "${img_base}/stromverbrauch_gesamt.png"
      image_format: PNG
      image_width: 256
      image_height: 150
      label_alignment: right_mid
      icon_alignment: bottom_mid


  now_playing_solar: !include
    file: ../../draft/ui/sensor/sendspin.yaml
    vars:
      uid: np_solar
      row: 0
      column: 4
      column_span: 2
      image_width: 100
      image_height: 100
      text_max_width: 50%
      label_font_title: nunito_20
      label_font_artist: nunito_20
      label_font_album: nunito_18
      page_id: "solar_page"
      bg_grad_dir: VER
      bg_color: $grad_media_top
      bg_grad_color: $grad_media_bottom


 # NAV (Menü: Grafiken aktiv)
  page_button_solar_main: !include
    file: ../../draft/ui/page/page_button_remoteimage.yaml
    vars:
      uid: page_button_solar_main
      row: 3
      column: 0
      column_span: 2
      text: ""
      icon: $mdi_home
      page_id: "solar_page"
      click_page: "main_page"
      image_url: "${img_base}/tile_home.png"
      image_format: PNG
      image_width: 256
      image_height: 150

  page_button_sol_media: !include
    file: ../../draft/ui/page/page_button_remoteimage.yaml
    vars:
      uid: page_button_sol_media
      row: 3
      column: 2
      column_span: 2
      text: "Media"
      icon: $mdi_page_next
      page_id: "solar_page"
      click_page: "media_page"
      image_url: "${img_base}/tile_media.png"
      image_format: PNG
      image_width: 256
      image_height: 150


  page_button_sol_heating: !include
    file: ../../draft/ui/page/page_button_remoteimage.yaml
    vars:
      uid: page_button_sol_heating
      row: 3
      column: 4
      column_span: 2
      text: "Heizung"
      icon: $mdi_page_next
      page_id: "solar_page"
      click_page: "heating_page"
      image_url: "${img_base}/tile_heizung.png"
      image_format: PNG
      image_width: 256
      image_height: 150


  page_button_sol_cal: !include
    file: ../../draft/ui/page/page_button_remoteimage.yaml
    vars:
      uid: page_button_sol_cal
      row: 3
      column: 6
      column_span: 2
      text: "Kalender"
      icon: $mdi_page_next
      page_id: "solar_page"
      click_page: "cal_page"
      image_url: "${img_base}/tile_kalender.png"
      image_format: PNG
      image_width: 256
      image_height: 150


# ── Seitendefinition ──
lvgl:
  pages:
    - id: solar_page
      layout: 4x8
      styles: page_style
      bg_color: 0x18213A      # Fallback
      bg_opa: COVER
      bg_grad: page_bg_grad
      <<: !include ../../esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      
