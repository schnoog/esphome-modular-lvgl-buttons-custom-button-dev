# ##PAGE

  page_button_camshow: !include
    file: ../../draft/ui/page/page_button_localimage.yaml
    vars:
      uid: page_button_camshow
      row: 0
      column: 0
      text: ""
      icon: ""
      page_id: "cam_page"
      click_page: "cam_page"
      image: nav_camera

  page_button_cam_main: !include
    file: ../../draft/ui/page/page_button_localimage.yaml
    vars:
      uid: page_button_cam_main
      row: 3
      column: 0
      column_span: 1
      text: ""
      icon: $mdi_home
      page_id: "cam_page"
      click_page: "main_page"
      image: nav_home_small


  cam_page_camview: !include
    file: ../../draft/ui/page/page_camerabutton.yaml
    vars:
      uid: cam_page_camview
      row: 0
      column: 1
      column_span: 5
      row_span: 4
  #    camera_url: http://192.168.178.119:8123/local/ramdisk/esp32s3cam.jpg
  #    camera_url: http://192.168.178.124:8081/
      camera_url: http://192.168.178.27:180/rd/esp32s3camX.jpg
      update_interval: 1s
      image_width: 800
      image_height: 600
      text: ""
      click_page: "cam_page"
      page_id: "cam_page"
      bg_grad_dir: VER
      bg_color: $grad_cam_top
      bg_grad_color: $grad_cam_bottom



