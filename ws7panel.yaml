# Substitution variables used through the codebase
substitutions:
  icon_font: mdi_icons_30
  text_font: nunito_20
  text_color: white
  bg_color: black
  button_on_color: "ep_orange"
  button_off_color: "very_dark_gray"
  icon_on_color: "yellow"
  icon_off_color: "gray"
  label_on_color: "white"
  label_off_color: "gray"
  button_text_color: "white"
  
  glyphsets: "GF_Latin_Core"

  # LCD back light modes - Code in backlight_time.yaml
  display_daytime_brightness: "100%"
  display_nighttime_brightness: "70%"
  display_night_hour: "23"      # Hour for night mode (0-23)
  display_night_minute: "59"    # Minute for night mode (0-59)
  display_backlight_timeout_always_enabled: "false"  # Set true to dim/off in all modes, not just Night
  display_backlight_timeout_initial: "5"  # Initial backlight timeout in minutes (-1 to disable)
  popup_timeout_seconds: '120'  # timeout in seconds  
  # Screen Size
  screen_height: 480
  screen_width: 800


esphome:
  name: "waveshareseven"
  friendly_name: "Waveshare 7 Panel"
  comment: "Waveshare 7 Panel"


logger:

mqtt:
  id: ws7_display
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  discovery_retain: true
  discovery_unique_id_generator: mac
  discovery_object_id_generator: device_name
  birth_message:
  will_message:
  shutdown_message:


script:
  # --------------------------------------------------------------------------
  # This script is called once per minute.
  # Any packages in this library will !extend time_update to update their own labels.
  # You can add code here to update your own custom labels.
  # --------------------------------------------------------------------------
  - id: time_update
    then:
      - lambda: |-
          // No operation

packages:
