button:
  - platform: template
    name: "Display vorherige Seite"
    icon: "mdi:arrow-left"
    on_press:
      - lvgl.page.previous

  - platform: template
    name: "Display nächste Seite"
    icon: "mdi:arrow-right"
    on_press:
      - lvgl.page.next

output:
  - id: !remove fake_backlight_output
  - platform: ledc
    id: backlight_pwm
    pin: GPIO16
    min_power: 0.07
    zero_means_zero: true

light:
  - id: !extend display_backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON


touchscreen:
  platform: gt911
  id: my_touchscreen
  display: my_display
  i2c_id: bus_a
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false

debug:
  update_interval: 10s

sensor:
  - platform: debug
    free:
      name: "Heap frei"
    block:
      name: "Heap größter Block"
    psram:
      name: "PSRAM frei"
    loop_time:
      name: "Loop Time"
  - id: !extend cpu_temperature
    filters: !remove
    unit_of_measurement: "°C"




# This is the main LVGL section. We start with a simple grid.
lvgl:

  gradients:
    - id: page_bg_grad
      direction: VER          # oben → unten
      dither: ORDERED         # verhindert Streifenbildung bei RGB565
      stops:
        - color: 0x2B2442     # Dämmer-Violett (Echo des Kupfertons)
          position: 0
        - color: 0x18213A     # Navy, passend zu den Kacheln
          position: 110
        - color: 0x0A0F1E     # Nachtblau
          position: 255

  buffer_size: 100%
  pages:
    - id: main_page
      layout: 4x8
      styles: page_style
      bg_color: 0x18213A      # Fallback
      bg_opa: COVER
      bg_grad: page_bg_grad
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml

    - id: cal_page
      styles: page_style
      bg_color: 0x18213A      # Fallback
      bg_opa: COVER
      bg_grad: page_bg_grad      
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml      
      widgets:
        - !include
          file: draft/ui/calendar/calendar_widget.yaml   # Pfad relativ zur Hauptdatei anpassen


        # You can use the package section above to add prebuilt button types or build your own custom button from scratch here.
        #- container:
        #    id: button_12
        #    grid_cell_x_align: stretch
        #    grid_cell_y_align: stretch
        #    grid_cell_row_pos: 3
        #    grid_cell_column_pos: 4
        #    grid_cell_row_span: 1
        #    grid_cell_column_span: 1
        #    outline_width: 1   # debug code - This is for visualizing boundaries remove for production
        #    outline_color: red  # debug code - This is for visualizing boundaries remove for production
        #    widgets:
        #      - label:
        #          text_font: $text_font
        #          align: center
        #          text_color: white
        #          text: "Cell 3,7"

